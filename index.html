    <button id="themeToggle" onclick="toggleTheme()">🌞/🌜</button>

 <div class="sidebar" id="sidebar">

    <h2>-</h2>
    <label>Valor Móvel:</label><input id="vlrmovel" type="number" value="0"/><br>

    <label>Quantidade de Linhas:</label>

        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
    </select><br>
    <label>Base UR:</label><input type="checkbox" id="baseUR"/><br>
    <label>Portabilidade:</label><input type="checkbox" id="Port"/><br>

    <label>Valor Final:</label><input id="vfl" type="number" disabled/><br>
